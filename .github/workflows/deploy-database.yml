name: 'Deploy SOAT Database Infra'
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DB_SECRET_NAME: "soat/infra/dbs"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_mongo_username: ${{ secrets.TF_VAR_MONGO_USERNAME }}
          TF_VAR_mongo_password: ${{ secrets.TF_VAR_MONGO_PASSWORD }}
          TF_VAR_vpc_id: ${{ secrets.TF_VAR_VPC_ID }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false    
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_mongo_username: ${{ secrets.TF_VAR_MONGO_USERNAME }}
          TF_VAR_mongo_password: ${{ secrets.TF_VAR_mongo_password }}
          TF_VAR_vpc_id: ${{ secrets.TF_VAR_VPC_ID }}
      
      - name: Get Terraform Outputs and Save to Secrets Manager
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          DB_HOSTNAME=$(terraform output -raw db_hostname)
          DB_PORT=$(terraform output -raw db_port)
          DB_USERNAME=$(terraform output -raw db_username)
          DB_PASSWORD=$(terraform output -raw db_password)
          DB_NAME=$(terraform output -raw db_name_output)
          DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOSTNAME}:${DB_PORT}/${DB_NAME}"

          REDIS_HOST=$(terraform output -raw redis_endpoint)
          REDIS_PORT=$(terraform output -raw redis_port)

          MONGO_HOST=$(terraform output -raw mongo_endpoint)
          MONGO_PORT=$(terraform output -raw mongo_port)

          aws secretsmanager put-secret-value \
            --secret-id ${{ env.DB_SECRET_NAME }} \
            --secret-string "{
              \"POSTGRES_HOST\":\"$DB_HOSTNAME\",
              \"POSTGRES_PORT\":\"$DB_PORT\",
              \"POSTGRES_USER\":\"$DB_USERNAME\",
              \"POSTGRES_PASSWORD\":\"$DB_PASSWORD\",
              \"DATABASE_URL\":\"$DATABASE_URL\",
              \"REDIS_HOST\":\"$REDIS_HOST\",
              \"REDIS_PORT\":\"$REDIS_PORT\",
              \"MONGO_HOST\":\"$MONGO_HOST\",
              \"MONGO_PORT\":\"$MONGO_PORT\",
              \"MONGO_USER\":\"$TF_VAR_mongo_username\",
              \"MONGO_PASSWORD\":\"$TF_VAR_mongo_password\"
            }"
